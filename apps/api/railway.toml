# ──────────────────────────────────────────────────────────────────
#  Auryn API — Railway deployment configuration
#
#  Railway reads this file from the service's root directory.
#  Set the service root to "apps/api" in the Railway dashboard,
#  or use the [build] dockerfilePath to point to the monorepo root.
# ──────────────────────────────────────────────────────────────────

[build]
# Dockerfile lives in apps/api/ but the build context is the monorepo root
# so it can access packages/* during the multi-stage build.
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/config/**",
  "packages/types/**",
  "packages/utils/**",
]

[deploy]
# The Dockerfile sets WORKDIR /app/apps/api in the production stage, so the
# startCommand is resolved relative to that path. Using "apps/api/dist/main.js"
# here would resolve to /app/apps/api/apps/api/dist/main.js and crash with
# MODULE_NOT_FOUND before the health check could ever pass.
#
# MANDATORY: migrate deploy before API start (NEVER db push in production).
# See docs/engineering/railway-prisma-deployment.md
# Script logs datasource host, fails container if migrate deploy fails.
startCommand = "sh scripts/migrate-and-start.sh"
healthcheckPath = "/health"
# 60 seconds (was 10s). Migrate-on-boot adds a few seconds for empty
# migration runs and can take longer for real schema changes, so the
# previous tight window risked false-positive healthcheck failures even
# when the API itself was fine.
# Allow migrate-on-boot before liveness succeeds.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
