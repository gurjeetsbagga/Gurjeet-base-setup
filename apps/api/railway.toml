# ──────────────────────────────────────────────────────────────────
#  Auryn API — Railway deployment configuration
#
#  Railway reads this file from the service's root directory.
#  Set the service root to "apps/api" in the Railway dashboard,
#  or use the [build] dockerfilePath to point to the monorepo root.
# ──────────────────────────────────────────────────────────────────

[build]
# Dockerfile lives in apps/api/ but the build context is the monorepo root
# so it can access packages/* during the multi-stage build.
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/config/**",
  "packages/types/**",
  "packages/utils/**",
]

[deploy]
# The Dockerfile sets WORKDIR /app/apps/api in the production stage, so the
# startCommand is resolved relative to that path. Using "apps/api/dist/main.js"
# here would resolve to /app/apps/api/apps/api/dist/main.js and crash with
# MODULE_NOT_FOUND before the health check could ever pass.
startCommand = "node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
